<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Norless improvements</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="pages">
        <button class="page-link" type="button" title="Open norless.com">
          <span class="dot"></span>
          <span class="name">norless.com</span>
        </button>
      </div>
      <div id="slides" class="slides hidden"></div>
    </header>

    <main>
      <section id="norlessLive">
        <h2>
          <span class="ic project-icon"></span><span>Project norless.com via bible.com <span class="muted">— language per window</span></span>
        </h2>
        <div id="norlessLiveRows" class="window-rows"></div>
      </section>

      <details id="settings">
        <summary>
          <span class="title"><span class="ic" id="settingsIcon"></span><span>Settings</span></span
          ><span class="chevron ic"></span>
        </summary>
        <div id="settingsBody" class="settings-body"></div>
      </details>
    </main>

    <div id="toast" class="toast hidden"></div>

    <script src="../icons/icons.js"></script>
    <script src="popup.js"></script>
    <script src="../norless-live/projection.js"></script>
    <script src="norless-live.js"></script>
  </body>
</html>
