<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Norless improvements</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="pages">
        <button class="page-link" data-page="ro" type="button">
          <span class="dot" data-page="ro"></span>
          <span class="flag">🇷🇴</span>
          <span class="name">app.norless</span>
        </button>
        <button class="page-link" data-page="ua" type="button">
          <span class="dot" data-page="ua"></span>
          <span class="flag">🇺🇦</span>
          <span class="name">app-ua.norless</span>
        </button>
      </div>
      <div id="slides" class="slides hidden"></div>
    </header>

    <main>
      <section id="norlessLive">
        <h2>
          <span class="ic project-icon"></span><span>Project verses from bible.com <span class="muted">— norless.com language per window</span></span>
        </h2>
        <div id="norlessLiveRows" class="window-rows"></div>
      </section>

      <!-- The old apps' part, shown only while app.norless.com or app-ua.norless.com is open. -->
      <div id="oldNorless" class="hidden">
        <section id="windows">
          <h2>
            <span class="ic project-icon"></span><span>Old Norless <span class="muted">— app.norless.com window</span></span>
          </h2>
          <div id="windowRows" class="window-rows"></div>
          <p id="conflictNote" class="note hidden">⚠️ A window is claimed by both pages. Re-assign it to fix.</p>
        </section>

        <div id="syncRow" class="sync-row"></div>

        <section id="playlist">
          <h2>📃 Playlist <span id="activeLabel" class="muted"></span></h2>
          <div class="btns">
            <button id="saveBtn" type="button"><span class="ic"></span><span>Save as HTML</span></button>
            <button id="copyBtn" type="button"><span class="ic"></span><span>Copy</span></button>
          </div>
        </section>
      </div>

      <details id="settings">
        <summary>
          <span class="title"><span class="ic" id="settingsIcon"></span><span>Settings</span></span
          ><span class="chevron ic"></span>
        </summary>
        <div id="settingsBody" class="settings-body"></div>
      </details>
    </main>

    <div id="toast" class="toast hidden"></div>

    <script src="../icons/icons.js"></script>
    <script src="popup.js"></script>
    <script src="../norless-live/projection.js"></script>
    <script src="norless-live.js"></script>
  </body>
</html>
