<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 24 24">
  <!--
    norless extension icon — the app's rainbow (icon-256.png → norless-source.png)
    shown inside a Chrome-"cast"-style TV/projector frame.
    Source of truth: edit this file, then regenerate the PNGs with:
      bash views/icons/build-icons.sh
  -->
  <defs>
    <!-- Rounded tile used to clip the background + the rainbow "screen". -->
    <clipPath id="tile">
      <rect x="0" y="0" width="24" height="24" rx="3.5" ry="3.5"/>
    </clipPath>
  </defs>

  <!-- Dark "screen" tile — same background as glossa-icon.svg. -->
  <rect x="0" y="0" width="24" height="24" rx="3.5" ry="3.5" fill="#0f172a"/>

  <!-- The rainbow itself, filling the screen, clipped to the rounded tile. -->
  <image href="norless-source.png" xlink:href="norless-source.png"
         x="0" y="0" width="24" height="24"
         preserveAspectRatio="xMidYMid meet" clip-path="url(#tile)"
         xmlns:xlink="http://www.w3.org/1999/xlink"/>

  <!--
    Cast-style TV frame (gray) — stroked path inset by 0.75 (= stroke-width/2)
    so the outer edge of the stroke sits flush with the tile edge.
    Corner radius 2.75 on the path → outer stroke radius = 2.75 + 0.75 = 3.5
    (matches the tile rx exactly). Path is open at the bottom-left for the waves.
  -->
  <path d="M0.75,10 L0.75,3.5 a2.75,2.75 0 0 1 2.75,-2.75 h17 a2.75,2.75 0 0 1 2.75,2.75 v17 a2.75,2.75 0 0 1 -2.75,2.75 H12"
        fill="none" stroke="#9ca3af" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!--
    3 cast-signal waves, centred on the implied bottom-left corner (0.75, 23.25).
    Each is a clockwise quarter-circle arc from the left frame edge to the
    bottom frame edge (radii 3, 6, 9 — same spacing as the Lucide cast icon).
  -->
  <path d="M0.75,20.25 A3,3 0 0 1 3.75,23.25"
        fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M0.75,17.25 A6,6 0 0 1 6.75,23.25"
        fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M0.75,14.25 A9,9 0 0 1 9.75,23.25"
        fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/>
</svg>
